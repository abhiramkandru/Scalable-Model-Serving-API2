# EXAMPLE ONLY, not applied by kustomization.yaml. Create the real secret out of band:
#   kubectl -n model-serving create secret generic inference-api-keys \
#     --from-file=api-keys.json=./api-keys.json
# In production prefer Secret Manager (CSI driver) or External Secrets over plain Kubernetes Secrets.
# Generate keys with:  python -c "import secrets; print('sk-' + secrets.token_urlsafe(32))"
#
# api-keys.json maps key -> tenant. `rps`/`burst` are per-replica token-bucket limits; `admin` allows config writes.
apiVersion: v1
kind: Secret
metadata:
  name: inference-api-keys
  namespace: model-serving
type: Opaque
stringData:
  api-keys.json: |
    {
      "REPLACE-ME-team-a-key": {"tenant": "team-a", "rps": 50, "burst": 100},
      "REPLACE-ME-team-b-key": {"tenant": "team-b", "rps": 20, "burst": 40},
      "REPLACE-ME-ops-key":    {"tenant": "ops", "admin": true}
    }
---
# Optional: only for gated Hugging Face models.
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: model-serving
type: Opaque
stringData:
  token: REPLACE-ME
