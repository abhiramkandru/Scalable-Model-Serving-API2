# Local stack: API (simulated GPU) + dashboard + Prometheus + Grafana.
#   docker compose -f deploy/docker/docker-compose.yml up --build
# Dashboard http://localhost:8080 · API http://localhost:8000 · Prometheus http://localhost:9090 · Grafana http://localhost:3001 (admin/admin)
# Generate traffic:  python loadtest/loadtest.py --url http://localhost:8000 --rps 60 --duration 120
name: model-serving

services:
  server:
    build: ../../server
    environment:
      BACKEND: sim
      PROMETHEUS_URL: http://prometheus:9090
      SLO_AVAILABILITY: "0.995"
      SLO_LATENCY_MS: "500"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build: ../../dashboard
    environment:
      API_UPSTREAM: server:8000
    ports: ["8080:8080"]
    depends_on:
      server: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
