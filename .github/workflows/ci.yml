name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/requirements*.txt }
      - run: pip install -r server/requirements-dev.txt pyyaml
      - run: cd server && python -m pytest -q
      - name: generated files are up to date
        run: |
          python deploy/sync_rules.py && python deploy/grafana/gen_dashboard.py
          git diff --exit-code deploy/k8s/rules.yaml deploy/grafana/dashboards/inference.json

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd dashboard && npm install && npm run build
